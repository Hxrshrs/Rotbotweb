services:
  - type: web
    name: rotbot-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    routes:
      - type: rewrite
        source: /rotbot/*
        destination: /*
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
      - key: NOTION_API_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: PORT
        value: 10000
      - key: FLASK_APP
        value: app.py
      - key: BASE_PATH
        value: /rotbot 